<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phitang AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f5f0ff, #ffffff);
  color: #222;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  font-size: 42px;
  margin-bottom: 10px;
  color: #7b3fc6;
}

.subtitle {
  font-size: 20px;
  color: #666;
  margin-bottom: 30px;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
}

.card img {
  width: 100%;
  max-width: 700px;
  border-radius: 18px;
}

.welcome {
  font-size: 24px;
  margin: 25px 0 10px;
}

.text {
  font-size: 18px;
  color: #666;
  line-height: 1.6;
}

.footer {
  margin-top: 35px;
  color: #888;
  font-size: 15px;
}
</style>
</head>

<body>

<div class="container">

  <h1>✨ Phitang AI ✨</h1>

  <div class="subtitle">
    Góc nhỏ lưu giữ hình ảnh, kỷ niệm và những điều thân yêu
  </div>

  <div class="card">

    <img src="IMG_1708.png" alt="Hình ảnh Phitang AI">

    <div class="welcome">
      Chào mừng đến với Phitang AI
    </div>

    <div class="text">
      Nơi lưu giữ những hình ảnh đẹp,<br>
      những tấm thiệp thân yêu<br>
      và những kỷ niệm đáng nhớ.
    </div>

  </div>

  <div class="footer">
    © 2026 Phitang AI
  </div>

</div>

</body>
</html>
